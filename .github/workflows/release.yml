name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Use runner Cargo target dir
        shell: pwsh
        run: |
          Remove-Item -Force "src-tauri/.cargo/config.toml" -ErrorAction SilentlyContinue

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        with:
          owner: vedprakash02
          repo: vidya-prabandh-releases
          tagName: ${{ github.ref_name }}
          releaseCommitish: main
          releaseName: Vidya Prabandh ${{ github.ref_name }}
          releaseBody: "Windows desktop update release."
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true